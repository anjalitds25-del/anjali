<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <title>Scholarship Application Form</title>
</head>
<body>

    <h2>Scholarship Application Form</h2>

    <!-- The form tag defines where the data goes (action attribute) and how it's sent (method attribute) -->
    <form action="/submit_scholarship" method="POST">

        <!-- Text Input for Name -->
        <label for="full_name">Full Name:</label><br>
        <input type="text" id="full_name" name="full_name" required><br><br>
        
        <!-- Text Input for Email -->
        <label for="email">Email Address:</label><br>
        <input type="email" id="email" name="email" required><br><br>

        <!-- Radio Buttons for selecting one option (Gender) -->
        <label>Gender:</label><br>
        <input type="radio" id="male" name="gender" value="male">
        <label for="male">Male</label><br>
        <input type="radio" id="female" name="gender" value="female">
        <label for="female">Female</label><br>
        <input type="radio" id="other" name="gender" value="other">
        <label for="other">Other</label><br><br>
